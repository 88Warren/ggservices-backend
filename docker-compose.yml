services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLATFORM: ${PLATFORM}
    image: lmwcode/ggservices-backend:v1.0.0
    container_name: ggservices_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
    ports:
      - "8090:8090"
    networks:
      - ggservices-network
    env_file:
      - .env.production
    volumes:
    - .env:/app/.env
    restart: unless-stopped


networks:
  ggservices-network:
    driver: bridge